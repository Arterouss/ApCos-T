name: Auto Sync Anime Catalog

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali (jam 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual kapan saja dari GitHub

jobs:
  sync-anime:
    name: Sync Otakudesu Catalog to MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Anime Sync Script
        run: node scripts/syncAnime.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://weirdxx2_db_user:03cXYaSrUa92bo8d@cluster0.4oo5epz.mongodb.net/?retryWrites=true&w=majority' }}
